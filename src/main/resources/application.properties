spring.application.name=rota-vital

# ---------------------------------------------------------------------------
# Banco de dados
# H2 em memoria: o banco vive enquanto a aplicacao roda e comeca limpo a cada
# subida. A troca para Postgres (Entrega 02) e so mudar a url e o driver.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:rotavital
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---------------------------------------------------------------------------
# Console do H2
# Interface web para inspecionar as tabelas durante o desenvolvimento.
# ATENCAO: nao deve ficar habilitado no deploy, expoe o banco.
# ---------------------------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ddl-auto=update faz o Hibernate criar e atualizar as tabelas a partir das
# entidades anotadas. show-sql imprime as queries no console.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---------------------------------------------------------------------------
# Actuator
# Expoe /actuator/health, usado pelo balanceador e pelo monitoramento para
# saber se a aplicacao esta viva.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info

# ---------------------------------------------------------------------------
# Servidor
# ---------------------------------------------------------------------------
server.port=8080
