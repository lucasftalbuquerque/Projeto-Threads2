# ---------------------------------------------------------------------------
# Perfil de producao.
#
# Ativado com --spring.profiles.active=prod, como faz o servico systemd na VM.
# O que esta aqui SOBRESCREVE o application.properties; o que nao esta,
# continua valendo de la.
#
# A regra deste arquivo: tudo que e conveniente em desenvolvimento e perigoso
# na internet publica fica desligado aqui.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Console do H2: DESLIGADO
#
# Em desenvolvimento ele e util para inspecionar as tabelas. Exposto na
# internet, e um terminal SQL aberto para qualquer um: le, altera e apaga
# qualquer dado sem pedir senha, porque o H2 em memoria sobe com usuario 'sa'
# e senha vazia.
#
# Esta e a linha mais importante do arquivo.
# ---------------------------------------------------------------------------
spring.h2.console.enabled=false

# ---------------------------------------------------------------------------
# SQL fora do log
#
# show-sql despeja toda consulta no console. Em producao isso enche o disco,
# atrapalha a leitura de erro de verdade e ainda pode vazar dado em log.
# ---------------------------------------------------------------------------
spring.jpa.show-sql=false

# ---------------------------------------------------------------------------
# Schema
#
# 'update' deixa o Hibernate alterar o banco sozinho a partir das entidades.
# Em desenvolvimento poupa trabalho; em producao, uma renomeacao de campo
# criaria coluna nova em vez de renomear, e os dados antigos ficariam
# inacessiveis sem ninguem perceber.
#
# O ideal em producao seria 'validate', que apenas confere se o banco bate com
# as entidades e recusa subir se nao bater. Mas enquanto o banco for H2 em
# memoria ele sobe vazio a cada restart, e 'validate' falharia por nao
# encontrar tabela alguma. Por isso 'create': o Hibernate monta o schema do
# zero, que e o comportamento correto para um banco efemero.
#
# Na migracao para PostgreSQL (Entrega 02) isto vira 'validate', e o schema
# passa a ser versionado por migration.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=create

# ---------------------------------------------------------------------------
# open-in-view desligado
#
# Ligado (o padrao), o Spring mantem a sessao do banco aberta ate a resposta
# HTTP terminar de ser escrita. Isso faz uma colecao carregada por demanda
# disparar consulta durante a serializacao do JSON, fora de qualquer
# transacao e sem aparecer no codigo.
#
# Desligado, esse acesso tardio vira erro explicito em vez de virar consulta
# silenciosa. Como os DTOs sao montados dentro do servico, com a transacao
# aberta, nada aqui depende desse comportamento.
# ---------------------------------------------------------------------------
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Erro sem stack trace
#
# O padrao do Spring ja omite a stack, mas deixamos explicito: mensagem de
# excecao na resposta HTTP entrega estrutura interna a quem esta sondando.
# ---------------------------------------------------------------------------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# ---------------------------------------------------------------------------
# Actuator: so o health
#
# O balanceador e o monitoramento precisam saber se a aplicacao esta viva.
# Nada alem disso e exposto: /actuator/env, por exemplo, lista variaveis de
# ambiente, e /actuator/beans mapeia a aplicacao inteira.
#
# show-details=never faz o /health responder apenas {"status":"UP"}, sem
# detalhar banco e disco para quem nao esta autenticado.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---------------------------------------------------------------------------
# Log
#
# INFO na aplicacao, WARN no resto. Em INFO global o Spring e o Hibernate
# despejam centenas de linhas por subida.
# ---------------------------------------------------------------------------
logging.level.root=WARN
logging.level.com.rotavital=INFO

# ---------------------------------------------------------------------------
# Porta: 8081, nao 8080
#
# A VM e compartilhada com outras aplicacoes, que ja ocupam as portas mais
# comuns. Duas aplicacoes nao podem escutar a mesma porta: a segunda a subir
# falha com "Port already in use" e o systemd entra em ciclo de reinicio.
#
# Em desenvolvimento continua 8080 (ver application.properties), porque la nao
# ha disputa. So o ambiente que compartilha a maquina precisa desviar.
# ---------------------------------------------------------------------------
server.port=8081

# ---------------------------------------------------------------------------
# Escuta apenas em localhost
#
# A aplicacao fica ATRAS do Nginx, que ja atende a porta 80 desta VM e
# encaminha /rota-vital/ para ca (ver infra/nginx-rota-vital.conf).
#
# Com este endereco, o sistema operacional recusa qualquer conexao vinda de
# fora da maquina: a unica porta de entrada e o Nginx. Mesmo que a porta 8081
# fosse aberta no firewall do GCP por engano, nao haveria o que alcancar.
#
# E a mesma ideia da sub-rede privada no diagrama do PI3-16, aplicada dentro
# de uma maquina so.
# ---------------------------------------------------------------------------
server.address=127.0.0.1
