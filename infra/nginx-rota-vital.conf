# Encaminha /rota-vital/ para a aplicacao Java, que escuta na 8081.
#
# INSTALACAO (a VM ja tem Nginx rodando; isto nao mexe no que existe):
#
#   sudo cp infra/nginx-rota-vital.conf /etc/nginx/snippets/rota-vital.conf
#
# Depois inclua UMA linha dentro do bloco `server` do site ja configurado,
# em /etc/nginx/sites-enabled/:
#
#   include snippets/rota-vital.conf;
#
# E recarregue sem derrubar conexao:
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# `nginx -t` valida a configuracao ANTES de aplicar. Se houver erro de
# sintaxe, ele recusa e o Nginx atual continua servindo normalmente. Nunca
# rode o reload sem o teste numa maquina com aplicacao em producao.

# --- API do Rota Vital ---
location /rota-vital/ {
    # A barra final no proxy_pass e significativa: com ela, o Nginx REMOVE o
    # prefixo /rota-vital antes de repassar. Assim uma chamada a
    #   /rota-vital/api/v1/bolsas
    # chega na aplicacao como
    #   /api/v1/bolsas
    # que e o caminho que os controllers conhecem.
    #
    # Sem a barra, o prefixo seria repassado e tudo daria 404.
    proxy_pass http://127.0.0.1:8081/;

    # 127.0.0.1 e nao o IP externo: o trafego nao sai da maquina.

    # Cabecalhos que preservam a identidade do cliente original. Sem eles a
    # aplicacao veria toda requisicao vindo do proprio servidor.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A aplicacao sobe em ~30s numa VM modesta. Durante esse tempo o Nginx
    # devolve 502; estes limites evitam que uma requisicao fique pendurada.
    proxy_connect_timeout 10s;
    proxy_read_timeout    30s;
}

# --- Bloqueio explicito do console do H2 ---
#
# O perfil de producao ja desliga o console (spring.h2.console.enabled=false),
# entao a aplicacao responderia 404 de qualquer forma. Este bloco e uma
# segunda barreira: se alguem religar o console por engano numa depuracao, o
# Nginx recusa antes de a requisicao chegar na aplicacao.
#
# Defesa em profundidade: duas travas independentes para a mesma falha.
location /rota-vital/h2-console {
    deny all;
    return 404;
}
